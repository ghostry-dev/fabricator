name: Publish

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
        description: The directory name under pkg/ of the package to publish.
      version:
        required: true
        type: string
        description: The version of the package to publish.
      build-run-id:
        required: true
        type: string
        description: The run ID of the build workflow that generated the artifacts to publish.

env:
  is-prerelease: ${{ contains(inputs.version, '-') }}
  pkg-dir: pkg/${{ inputs.package }}

jobs:
  pack:
    name: Pack
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      filename: ${{ inputs.package }}-${{ inputs.version }}.tgz
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: pkg-${{ inputs.package }}
          path: ${{ env.pkg-dir }}/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build-run-id }}
          repository: ${{ github.repository }}

      - name: Construct tarball path
        id: tarball-path
        run: >
          echo "path=${{ github.workspace }}/${{ env.pkg-dir }}/${{ env.filename }}"
          >> $GITHUB_OUTPUT

      - name: Pack
        working-directory: ${{ env.pkg-dir }}
        run: bun pm pack --filename ${{ steps.tarball-path.outputs.path }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.filename }}
          path: ${{ steps.tarball-path.outputs.path }}
          if-no-files-found: error

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.tarball-path.outputs.path }}

  release-github:
    name: Create release on GitHub
    needs: [pack]
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.package }}-${{ inputs.version }}.tgz
          path: ${{ github.workspace }}/dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ inputs.package }} ${{ inputs.version }}
          tag_name: ${{ inputs.package }}/${{ inputs.version }}
          target_commitish: ${{ github.ref }}
          prerelease: ${{ env.is-prerelease }}
          fail_on_unmatched_files: true
          files: ${{ github.workspace }}/dist/*.tgz

  ##
  # https://docs.npmjs.com/generating-provenance-statements#example-github-actions-workflow
  # https://docs.npmjs.com/trusted-publishers#step-2-configure-your-cicd-workflow
  #
  publish-npm:
    name: Publish to NPM
    permissions:
      contents: read
      id-token: write
    needs: [pack]
    env:
      filename: ${{ inputs.package }}-${{ inputs.version }}.tgz
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.filename }}
          path: ${{ github.workspace }}/dist
          merge-multiple: true

      ##
      # Until Bun supports publishing with provenance, npm with Node is required.
      # https://github.com/oven-sh/bun/issues/15601
      #
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      ##
      # npm authenticates through trusted publishing (OIDC) alone; there is
      # no token. Provenance comes from the `id-token: write` permission
      # above, which `main.yml` must also grant — npm requires it on both
      # the calling and the called workflow.
      #
      # A trusted publisher can only be configured for a package that
      # already exists, so a new package under `pkg/` is claimed by hand
      # first: publish a README-only stub at `0.0.0` from a maintainer's
      # machine (`npm publish --access public`, 2FA), then add a trusted
      # publisher on npmjs.com naming `main.yml` — npm validates a reusable
      # workflow against its caller, not this file — with direct publishing
      # enabled, since a new configuration only allows `npm stage publish`
      # by default. CI then publishes every real version with provenance;
      # deprecate the stub once the first one is live. Until that is done,
      # this step fails for that package.
      #
      - name: Publish
        run: >
          bunx --no-install npm publish
          ${{ github.workspace }}/dist/${{ env.filename }}
          --tag ${{ env.is-prerelease == 'true' && 'experimental' || 'latest' }}
          --provenance

  publish-jsr:
    name: Publish to JSR
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Publish
        working-directory: ${{ env.pkg-dir }}
        run: bunx --no-install jsr publish
