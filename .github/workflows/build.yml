name: Build

on:
  workflow_call:
    outputs:
      run-id:
        value: ${{ github.run_id }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload `fabricator`
        uses: actions/upload-artifact@v7
        with:
          name: pkg-fabricator
          path: pkg/fabricator/dist
          if-no-files-found: error

      - name: Upload `fabricator-adapter-typebox-v0`
        uses: actions/upload-artifact@v7
        with:
          name: pkg-fabricator-adapter-typebox-v0
          path: pkg/fabricator-adapter-typebox-v0/dist
          if-no-files-found: error

      - name: Upload `fabricator-extension-faker-v10`
        uses: actions/upload-artifact@v7
        with:
          name: pkg-fabricator-extension-faker-v10
          path: pkg/fabricator-extension-faker-v10/dist
          if-no-files-found: error
