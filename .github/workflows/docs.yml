name: Docs

on:
  workflow_call:
    inputs:
      upload:
        required: false
        type: boolean
        default: false
        description: >
          Upload the built site as a GitHub Pages artifact. Off for pull
          requests, which build only to validate.

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      ##
      # `docs/` resolves `@ghostry/fabricator` as `file:../pkg/fabricator` (for
      # twoslash — see `docs/package.json`), which needs core's `dist/` to
      # exist before `docs/`'s own install/build can resolve or type-check
      # against it. This runs at the repo root, ignoring this job's default
      # `working-directory: docs`.
      #
      - name: Install Root Dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Build Packages
        working-directory: .
        run: bun run build

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Configure Pages
        if: ${{ inputs.upload }}
        uses: actions/configure-pages@v6

      - name: Build
        run: bun run build

      ##
      # `path` is repo-root-relative regardless of `working-directory` above,
      # which only applies to `run:` steps.
      #
      - name: Upload
        if: ${{ inputs.upload }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist/public
